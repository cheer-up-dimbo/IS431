<svg viewBox="0 0 1000 790" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#4b5563"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#3b82f6"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#ca8a04"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#7c3aed"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#059669"/></marker>
  </defs>

  <rect width="1000" height="790" fill="#fff"/>


  <!-- ================================================================ -->
  <!-- USER                                                             -->
  <!-- ================================================================ -->
  <rect x="380" y="26.0" width="240" height="44" rx="22" fill="#1e293b"/>
  <text x="500" y="54.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Boxer (User)</text>

  <!-- Single stem from user centre, then split left and right -->
  <line x1="500" y1="70.0" x2="500" y2="94.0" stroke="#64748b" stroke-width="1.3"/>
  <line x1="300" y1="94.0" x2="700" y2="94.0" stroke="#64748b" stroke-width="1.3"/>
  <line x1="300" y1="94.0" x2="300" y2="126.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="700" y1="94.0" x2="700" y2="126.0" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ================================================================ -->
  <!-- TIER 1: SENSING                                                  -->
  <!-- ================================================================ -->
  <text x="50" y="110.0" font-size="11" font-weight="700" fill="#94a3b8">SENSING</text>
  <line x1="50" y1="116.0" x2="950" y2="116.0" stroke="#e2e8f0"/>

  <rect x="160" y="128.0" width="280" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Depth Camera</text>
  <text x="300" y="170.0" text-anchor="middle" font-size="11" fill="#4b5563">RealSense D435i · RGB-D · 30 fps</text>

  <rect x="560" y="128.0" width="280" height="54" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="700" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Impact Sensors</text>
  <text x="700" y="170.0" text-anchor="middle" font-size="11" fill="#4b5563">MPU6050 · 4 pads (C/L/R/H)</text>

  <!-- ================================================================ -->
  <!-- TIER 2: PROCESSORS                                               -->
  <!-- ================================================================ -->
  <text x="50" y="224.0" font-size="11" font-weight="700" fill="#94a3b8">PROCESSORS</text>
  <line x1="50" y1="230.0" x2="950" y2="230.0" stroke="#e2e8f0"/>

  <!-- Arrows: sensing → hardware (straight down) -->
  <line x1="270" y1="182.0" x2="270" y2="244.0" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#aB)"/>
  <text x="282" y="218.0" font-size="9" font-weight="600" fill="#3b82f6">USB 3.0</text>
  <line x1="730" y1="182.0" x2="730" y2="244.0" stroke="#ca8a04" stroke-width="1.3" marker-end="url(#aO)"/>
  <text x="742" y="218.0" font-size="9" font-weight="600" fill="#ca8a04">I2C bus</text>

  <rect x="120" y="246.0" width="300" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="274.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Jetson Orin NX</text>
  <text x="270" y="294.0" text-anchor="middle" font-size="11" fill="#4b5563">16 GB · ROS 2 · TensorRT · GPU shared</text>
  <text x="270" y="312.0" text-anchor="middle" font-size="11" fill="#3b82f6">CV + LLM inference on-device</text>

  <rect x="580" y="246.0" width="300" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="730" y="274.0" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Teensy 4.1</text>
  <text x="730" y="294.0" text-anchor="middle" font-size="11" fill="#4b5563">600 MHz ARM · I2C sensors · PWM motors</text>
  <text x="730" y="312.0" text-anchor="middle" font-size="11" fill="#ca8a04">Reads IMU + drives all actuators</text>

  <!-- USB Serial bridge (thick connecting line with label) -->
  <line x1="420" y1="286.0" x2="460" y2="286.0" stroke="#475569" stroke-width="3"/>
  <rect x="460" y="272.0" width="100" height="28" rx="14" fill="#475569"/>
  <text x="510" y="290.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">USB Serial</text>
  <line x1="560" y1="286.0" x2="580" y2="286.0" stroke="#475569" stroke-width="3"/>
  <text x="510" y="314.0" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">micro-ROS</text>

  <!-- ================================================================ -->
  <!-- TIER 3: INTELLIGENCE                                             -->
  <!-- ================================================================ -->
  <text x="50" y="366.0" font-size="11" font-weight="700" fill="#94a3b8">INTELLIGENCE</text>
  <line x1="50" y1="372.0" x2="950" y2="372.0" stroke="#e2e8f0"/>

  <line x1="270" y1="326.0" x2="270" y2="386.0" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#aP)"/>
  <text x="282" y="362.0" font-size="9" font-weight="600" fill="#7c3aed">RGB-D + IMU data</text>

  <!-- Intelligence container -->
  <rect x="80" y="388.0" width="840" height="170" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>

  <!-- Pipeline: 3 boxes in a row -->
  <rect x="104" y="406.0" width="200" height="56" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="204" y="430.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Action Prediction</text>
  <text x="204" y="448.0" text-anchor="middle" font-size="9.5" fill="#4b5563">96.8% · 8 classes · 30 fps</text>

  <line x1="304" y1="434.0" x2="332" y2="434.0" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#aP)"/>

  <rect x="336" y="406.0" width="200" height="56" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="436" y="430.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Sensor Fusion</text>
  <text x="436" y="448.0" text-anchor="middle" font-size="9.5" fill="#4b5563">CV + IMU · pad constraints</text>

  <line x1="536" y1="434.0" x2="564" y2="434.0" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#aP)"/>

  <rect x="568" y="406.0" width="200" height="56" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="668" y="430.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Sparring AI</text>
  <text x="668" y="448.0" text-anchor="middle" font-size="9.5" fill="#4b5563">5 styles · weakness tracking</text>

  <!-- Support row: 2 boxes -->
  <rect x="104" y="476.0" width="200" height="44" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="204" y="500.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">LLM Coach</text>
  <text x="204" y="514.0" text-anchor="middle" font-size="9.5" fill="#4b5563">Qwen2.5-3B · on-device</text>

  <rect x="336" y="476.0" width="200" height="44" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="436" y="500.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Analytics</text>
  <text x="436" y="514.0" text-anchor="middle" font-size="9.5" fill="#4b5563">Trends · XP · records</text>

  <!-- Session Manager bar -->
  <rect x="104" y="532.0" width="432" height="18" rx="3" fill="#ede9fe"/>
  <text x="320" y="545.0" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Session Manager · idle → active → rest → complete · 2 Hz heartbeat</text>

  <!-- Data/Backend (right column inside intelligence) -->
  <rect x="568" y="476.0" width="330" height="74" rx="5" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="733" y="500.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Data + Backend</text>
  <text x="733" y="518.0" text-anchor="middle" font-size="9.5" fill="#4b5563">SQLite (2-tier) · FastAPI · WebSocket</text>
  <text x="733" y="534.0" text-anchor="middle" font-size="9.5" fill="#4b5563">IPC /tmp/ bridge (GUI ↔ phone)</text>

  <!-- ================================================================ -->
  <!-- TIER 4: ROBOT PHYSICAL STRUCTURE + INTERFACE                     -->
  <!-- ================================================================ -->
  <!-- Tier labels -->
  <text x="50" y="598.0" font-size="11" font-weight="700" fill="#94a3b8">ROBOT MECHANISM</text>
  <text x="570" y="598.0" font-size="11" font-weight="700" fill="#94a3b8">INTERFACE</text>
  <line x1="50" y1="604.0" x2="530" y2="604.0" stroke="#e2e8f0"/>
  <line x1="570" y1="604.0" x2="950" y2="604.0" stroke="#e2e8f0"/>

  <!-- Arrow: intelligence → mechanism -->
  <line x1="280" y1="558.0" x2="280" y2="618.0" stroke="#ca8a04" stroke-width="1.2" marker-end="url(#aO)"/>
  <text x="292" y="586.0" font-size="9" font-weight="600" fill="#ca8a04">(motor commands)</text>
  <text x="292" y="598.0" font-size="9" font-weight="600" fill="#ca8a04">punch, height, yaw</text>

  <!-- Arrows: intelligence → interface -->
  <line x1="685" y1="558.0" x2="685" y2="618.0" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#aB)"/>
  <text x="697" y="592.0" font-size="9" font-weight="600" fill="#3b82f6">session + tips</text>
  <line x1="875" y1="558.0" x2="875" y2="618.0" stroke="#059669" stroke-width="1.2" marker-end="url(#aG)"/>
  <text x="887" y="592.0" font-size="9" font-weight="600" fill="#059669">analytics + chat</text>

  <!-- Mechanism components -->
  <rect x="60" y="620.0" width="140" height="48" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="130" y="642.0" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Arms</text>
  <text x="130" y="658.0" text-anchor="middle" font-size="9.5" fill="#4b5563">2-DOF · 6 punches</text>

  <rect x="216" y="620.0" width="140" height="48" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="286" y="642.0" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Height</text>
  <text x="286" y="658.0" text-anchor="middle" font-size="9.5" fill="#4b5563">User-controlled via phone/GUI</text>

  <rect x="372" y="620.0" width="140" height="48" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="442" y="642.0" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Yaw</text>
  <text x="442" y="658.0" text-anchor="middle" font-size="9.5" fill="#4b5563">Tracks user L/R</text>

  <!-- Base + structure bar -->
  <rect x="60" y="680.0" width="452" height="28" rx="4" fill="#f1f3f5" stroke="#d1d5db" stroke-width="1"/>
  <text x="286" y="699.0" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">Structural Base · 4 Pads + Camera Mount · FoS ≥ 1.5 · Portable</text>

  <!-- Interface components -->
  <rect x="590" y="620.0" width="170" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="675" y="642.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a5f">Touchscreen</text>
  <text x="675" y="658.0" text-anchor="middle" font-size="9.5" fill="#4b5563">PySide6 · 24 pages</text>

  <rect x="780" y="620.0" width="170" height="48" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="865" y="642.0" text-anchor="middle" font-size="11" font-weight="700" fill="#064e3b">Phone</text>
  <text x="865" y="658.0" text-anchor="middle" font-size="9.5" fill="#4b5563">Vue 3 · WiFi · WebSocket</text>



  <!-- ================================================================ -->
  <!-- PLATFORM BAR                                                     -->
  <!-- ================================================================ -->
  <rect x="50" y="726.0" width="900" height="26" rx="4" fill="#f1f5f9"/>
  <text x="500" y="744.0" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">All on-device · Jetson Orin NX · ROS 2 Humble · Teensy micro-ROS · TensorRT FP16 · zero cloud dependency</text>

  <!-- LEGEND (centred) -->
  <rect x="240" y="763.0" width="10" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="256" y="772.0" font-size="9" fill="#4b5563">Jetson</text>
  <rect x="310" y="763.0" width="10" height="10" rx="2" fill="#fefce8" stroke="#ca8a04" stroke-width="0.8"/>
  <text x="326" y="772.0" font-size="9" fill="#4b5563">Teensy</text>
  <rect x="388" y="763.0" width="10" height="10" rx="2" fill="#faf5ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="404" y="772.0" font-size="9" fill="#4b5563">Intelligence</text>
  <rect x="480" y="763.0" width="10" height="10" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
  <text x="496" y="772.0" font-size="9" fill="#4b5563">Phone</text>
  <rect x="548" y="763.0" width="10" height="10" rx="2" fill="#1e293b"/>
  <text x="564" y="772.0" font-size="9" fill="#4b5563">User</text>
  <line x1="610" y1="768.0" x2="638" y2="768.0" stroke="#64748b" stroke-width="1.2"/>
  <text x="646" y="772.0" font-size="9" fill="#4b5563">Data flow</text>

</svg>
