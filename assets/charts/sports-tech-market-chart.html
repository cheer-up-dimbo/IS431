<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      max-width: 700px;
      width: 100%;
    }
    .source-note {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <canvas id="marketChart"></canvas>
  <p class="source-note">Source: Grand View Research, Sports Technology Market Report (https://www.grandviewresearch.com/industry-analysis/sports-technology-market)</p>
  <script>
    const labels = ['2020', '2021', '2022', '2023', '2024', '2025', '2026', '2027', '2028'];
    const data = [17.9, 20.6, 23.8, 27.6, 32.1, 37.4, 43.2, 49.1, 55.9];
    const colors = data.map((_, i) => i === data.length - 1 ? '#e67e22' : '#2c7bb6');

    new Chart(document.getElementById('marketChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Market Size (USD Billion)',
          data: data,
          backgroundColor: colors,
          borderRadius: 4,
        }]
      },
      options: {
        plugins: {
          title: {
            display: true,
            text: 'Global Sports Technology Market Size (USD Billion)',
            font: { size: 14 }
          },
          legend: { display: false }
        },
        scales: {
          x: { grid: { display: false } },
          y: {
            grid: { display: false },
            ticks: { callback: val => '$' + val + 'B' }
          }
        }
      }
    });
  </script>
</body>
</html>
