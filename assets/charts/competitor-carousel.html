<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: transparent;
    }
    .carousel {
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 600px;
      width: 100%;
    }
    .carousel-content {
      flex: 1;
      text-align: center;
    }
    .carousel-content img {
      max-height: 300px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .caption {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    .caption strong {
      display: block;
      font-size: 14px;
      color: #222;
      margin-bottom: 4px;
    }
    .arrow {
      background: none;
      border: 2px solid #ccc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #444;
      transition: border-color 0.2s;
    }
    .arrow:hover { border-color: #888; }
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
    }
    .dot.active { background: #2c7bb6; }
  </style>
  <script src="/components/report-nav/report-nav.js" defer></script>
</head>
<body>
  <div class="carousel">
    <button class="arrow" id="prev">&#8592;</button>
    <div class="carousel-content">
      <img id="slide-img" src="" alt="">
      <div class="caption">
        <strong id="slide-title"></strong>
        <span id="slide-desc"></span>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <button class="arrow" id="next">&#8594;</button>
  </div>

  <script>
    const slides = [
      {
        src: '../competitors/nexersys.jpg',
        title: 'Nexersys',
        desc: 'Interactive strike targets with on-screen coaching. Reactive only; cannot initiate punches.'
      },
      {
        src: '../competitors/stryk-rxt1.jpg',
        title: 'STRYK RXT-1',
        desc: 'Four foam arms that swing at the user. Preset combinations only; no performance adaptation.'
      },
      {
        src: '../competitors/botboxer.jpg',
        title: 'BotBoxer by SkyTechSport',
        desc: 'AI-powered dodging bag with sensor feedback. Evades punches but does not strike back.'
      }
    ];

    let current = 0;

    const img = document.getElementById('slide-img');
    const title = document.getElementById('slide-title');
    const desc = document.getElementById('slide-desc');
    const dotsContainer = document.getElementById('dots');

    const dots = slides.map((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
      return dot;
    });

    function goTo(index) {
      current = (index + slides.length) % slides.length;
      img.src = slides[current].src;
      img.alt = slides[current].title;
      title.textContent = slides[current].title;
      desc.textContent = slides[current].desc;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next').addEventListener('click', () => goTo(current + 1));

    goTo(0);
  </script>
</body>
</html>
