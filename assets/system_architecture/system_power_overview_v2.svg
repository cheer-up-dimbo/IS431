<!-- Split wiring: (625,140) → T-junction → (320,178) and (930,178) -->
<line x1="625" y1="140" x2="625" y2="158" stroke="#888888" stroke-width="1.5"/>
<line x1="320" y1="158" x2="930" y2="158" stroke="#888888" stroke-width="1.5"/>
