<line x1="930" y1="158" x2="930" y2="178" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ═══ SECTION: POWER SUPPLIES ═══════════════════════════════════ -->
<text x="40" y="168" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
