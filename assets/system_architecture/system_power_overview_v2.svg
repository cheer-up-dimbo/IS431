<text x="1197" y="528" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
      font-size="10" font-weight="bold" fill="#378ADD" letter-spacing="0.5">12V LOGIC DOMAIN (ISOLATED)</text>




<!-- AC Mains (cx=625, midpoint between 320 and 930) -->
<rect x="485" y="88" width="280" height="52" rx="26" fill="#1e2235" stroke="#1e2235" stroke-width="1.5"/>
<text x="625" y="114" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
