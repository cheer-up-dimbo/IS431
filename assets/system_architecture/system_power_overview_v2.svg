  </marker>
</defs>

<!-- Background -->
<rect width="1240" height="960" fill="#ffffff"/>

<!-- ═══ DOMAIN ENCLOSURES (behind everything) ═════════════════════ -->
<!-- 24V Domain: center=320, x=40→600 -->
<rect x="40" y="184" width="560" height="580" rx="14"
      fill="#FDF5E4" fill-opacity="0.18" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="8,4"/>
<!-- 12V Domain: center=930, x=655→1205 -->
<rect x="655" y="184" width="550" height="330" rx="14"
      fill="#E6F1FB" fill-opacity="0.18" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="8,4"/>

<!-- Domain bottom labels -->
<text x="50" y="780" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
