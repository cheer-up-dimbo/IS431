<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <rect width="900" height="480" fill="white" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- === LEFT PANEL === -->
  <text x="235" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2C2A">Architecture search</text>
  <text x="235" y="50" text-anchor="middle" font-size="11" fill="#5F5E5A">With inconsistent training data</text>

  <line x1="80" y1="100" x2="80" y2="360" stroke="#888780" stroke-width="0.5"/>
  <line x1="80" y1="360" x2="420" y2="360" stroke="#888780" stroke-width="0.5"/>

  <!-- Scale: 84%=y360, 98%=y100. Range=260px for 14%. Each 1%=18.57px -->
  <text x="70" y="100" text-anchor="end" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">98%</text>
  <line x1="80" y1="100" x2="420" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="70" y="193" text-anchor="end" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">93%</text>
  <line x1="80" y1="193" x2="420" y2="193" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="70" y="286" text-anchor="end" font-size="11" font-weight="500" fill="#444441" dominant-baseline="central">88%</text>
  <line x1="80" y1="286" x2="420" y2="286" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="30" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#444441" transform="rotate(-90, 30, 230)">Validation accuracy (%)</text>

  <!-- y = 360 - (val-84)*18.57 -->
  <!-- v1: 86.0 → y=360-2*18.57=322.9 h=37.1 -->
  <rect x="95" y="323" width="32" height="37" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="111" y="313" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">86.0</text>
  <text x="111" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v1</text>

  <!-- v2: 91.0 → y=360-7*18.57=230.0 h=130 -->
  <rect x="137" y="230" width="32" height="130" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="153" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">91.0</text>
  <text x="153" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v2</text>

  <!-- v3: 90.1 → y=360-6.1*18.57=246.7 h=113.3 -->
  <rect x="179" y="247" width="32" height="113" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="195" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">90.1</text>
  <text x="195" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v3</text>

  <!-- v4: 88.7 → y=360-4.7*18.57=272.7 h=87.3 -->
  <rect x="221" y="273" width="32" height="87" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="237" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">88.7</text>
  <text x="237" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v4</text>

  <!-- v5: 92.8 → y=360-8.8*18.57=196.6 h=163.4 -->
  <rect x="263" y="197" width="32" height="163" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="279" y="187" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">92.8</text>
  <text x="279" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#04342C">v5</text>

  <!-- v6: 88.2 → y=360-4.2*18.57=282.0 h=78 -->
  <rect x="305" y="282" width="32" height="78" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="321" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">88.2</text>
  <text x="321" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v6</text>

  <!-- v7: 87.3 → y=360-3.3*18.57=298.7 h=61.3 -->
  <rect x="347" y="299" width="32" height="61" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="363" y="289" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">87.3</text>
  <text x="363" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v7</text>

  <!-- v8: 90.9 → y=360-6.9*18.57=231.9 h=128.1 -->
  <rect x="389" y="232" width="32" height="128" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="405" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">90.9</text>
  <text x="405" y="376" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">v8</text>

  <!-- Ceiling line -->
  <line x1="80" y1="197" x2="430" y2="197" stroke="#D85A30" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="415" y="190" text-anchor="end" font-size="11" font-weight="700" fill="#D85A30">92.8% ceiling</text>

  <!-- Separator -->
  <line x1="460" y1="70" x2="460" y2="390" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- === RIGHT PANEL === -->
  <text x="670" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#26215C">Data curation</text>
  <text x="670" y="50" text-anchor="middle" font-size="11" fill="#5F5E5A">Same architecture (v5), cleaned data</text>

  <line x1="510" y1="100" x2="510" y2="360" stroke="#888780" stroke-width="0.5"/>
  <line x1="510" y1="360" x2="830" y2="360" stroke="#888780" stroke-width="0.5"/>
  <line x1="510" y1="100" x2="830" y2="100" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="510" y1="193" x2="830" y2="193" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="510" y1="286" x2="830" y2="286" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Before: 92.8% → y=197, h=163 -->
  <rect x="560" y="197" width="90" height="163" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="605" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">92.8%</text>
  <text x="605" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">Before</text>

  <!-- Arrow -->
  <line x1="658" y1="280" x2="698" y2="280" stroke="#534AB7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- After: 97.3% → y=360-13.3*18.57=113.0, h=247 -->
  <rect x="706" y="113" width="90" height="247" rx="4" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.8"/>
  <text x="751" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#26215C">97.3%</text>
  <text x="751" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#26215C">After</text>

  <text x="680" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#534AB7">+4.5%</text>

  <!-- Key finding -->
  <rect x="150" y="410" width="600" height="46" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#412402">Data curation had the largest impact on accuracy.</text>
  <text x="450" y="446" text-anchor="middle" font-size="11" font-weight="500" fill="#633806">Removing inconsistent form data (+4.5%) and fixing block annotations → deployed v11 at 96.8%.</text>
</svg>
