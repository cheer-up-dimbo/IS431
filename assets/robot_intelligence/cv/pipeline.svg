<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <rect width="900" height="420" fill="white" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== TRAINING PATH ===== -->
  <text x="450" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">Training pipeline</text>

  <!-- Step 1: Record -->
  <rect x="40" y="50" width="130" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#04342C">Record</text>
  <text x="105" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">RGB + depth</text>
  <text x="105" y="104" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">60fps, RealSense</text>

  <line x1="170" y1="83" x2="196" y2="83" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: Annotate -->
  <rect x="200" y="50" width="130" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="265" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#04342C">Annotate</text>
  <text x="265" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">Punch start/end</text>
  <text x="265" y="104" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">+ class label (GUI)</text>

  <line x1="330" y1="83" x2="356" y2="83" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Extract -->
  <rect x="360" y="50" width="130" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="425" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#04342C">Extract</text>
  <text x="425" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">Voxel + YOLO pose</text>
  <text x="425" y="104" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">features per frame</text>

  <line x1="490" y1="83" x2="516" y2="83" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Build -->
  <rect x="520" y="50" width="130" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="585" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#04342C">Build dataset</text>
  <text x="585" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">Segment windows</text>
  <text x="585" y="104" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">+ train/val splits</text>

  <line x1="650" y1="83" x2="676" y2="83" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 5: Train -->
  <rect x="680" y="50" width="170" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="765" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#26215C">Train</text>
  <text x="765" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3C3489">Fusion transformer</text>
  <text x="765" y="104" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3C3489">Focal loss + augmentation</text>

  <!-- Separator -->
  <line x1="40" y1="146" x2="860" y2="146" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="6 4"/>

  <!-- ===== DEPLOYMENT PATH ===== -->
  <text x="450" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#185FA5">Deployment pipeline (real-time on Jetson Orin Nano)</text>

  <!-- Camera -->
  <rect x="40" y="196" width="120" height="150" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="100" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#2C2C2A">RealSense</text>
  <text x="100" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#2C2C2A">D435i</text>
  <text x="100" y="260" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">30 fps live</text>

  <!-- Split arrow -->
  <line x1="160" y1="271" x2="190" y2="271" stroke="#888780" stroke-width="1"/>
  <line x1="190" y1="271" x2="190" y2="237" stroke="#888780" stroke-width="0.5"/>
  <line x1="190" y1="271" x2="190" y2="305" stroke="#888780" stroke-width="0.5"/>
  <line x1="190" y1="237" x2="216" y2="237" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="190" y1="305" x2="216" y2="305" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Depth branch -->
  <rect x="220" y="214" width="200" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="320" y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#04342C">Depth → voxel features</text>
  <text x="320" y="250" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#085041">~8ms per frame</text>

  <!-- RGB branch -->
  <rect x="220" y="282" width="200" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="300" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#042C53">RGB → YOLO pose</text>
  <text x="320" y="318" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0C447C">~16ms per frame</text>



  <!-- Merge -->
  <line x1="420" y1="237" x2="448" y2="237" stroke="#888780" stroke-width="0.5"/>
  <line x1="420" y1="305" x2="448" y2="305" stroke="#888780" stroke-width="0.5"/>
  <line x1="448" y1="237" x2="448" y2="305" stroke="#888780" stroke-width="0.5"/>
  <line x1="448" y1="271" x2="474" y2="271" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Fusion model -->
  <rect x="478" y="248" width="160" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="558" y="266" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#26215C">Fusion model</text>
  <text x="558" y="284" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3C3489">TensorRT FP16, ~8ms</text>

  <line x1="638" y1="271" x2="664" y2="271" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Prediction + smoothing -->
  <rect x="668" y="248" width="180" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="758" y="266" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#26215C">Prediction + EMA</text>
  <text x="758" y="284" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3C3489">8 classes → robot action</text>

  <!-- Total latency -->
  <text x="450" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#444441">Total: ~24ms per frame (42 fps theoretical, 30 fps practical)</text>


</svg>
